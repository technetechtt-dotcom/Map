name: Staging exercise

on:
  workflow_dispatch:
  schedule:
    - cron: "40 2 * * 1"

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ictmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ictmap?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ictmap?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-not-for-production-use-32ch"
      NEXTAUTH_URL: "http://127.0.0.1:3000"
      CAPTCHA_DISABLED: "1"
      BACKUP_ENCRYPTION_KEY: "ci-backup-encryption-key-min-16"
      ALLOW_DEMO_USERS: "0"
      SEED_ADMIN_PASSWORD: "CI-Temp-Admin-Pass-99!"
      ALLOW_DATABASE_RESET: "1"
      GEOCODER_DISABLED: "1"
      HIBP_DISABLED: "1"
      E2E: "1"
      RATE_LIMIT_ALLOW_MEMORY: "1"
      TRUST_PROXY: "0"
      REMOTE_STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Build and start staging app
        run: |
          if [ -n "$REMOTE_STAGING_BASE_URL" ]; then
            echo "Using remote staging app $REMOTE_STAGING_BASE_URL"
            echo "STAGING_BASE_URL=$REMOTE_STAGING_BASE_URL" >> "$GITHUB_ENV"
            exit 0
          fi
          npx prisma generate
          npm run build
          npx next start -p 3000 &
          echo $! > .staging-app.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health/live >/dev/null; then
              echo "STAGING_BASE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "staging app did not become ready"
          exit 1
      - name: Full staging exercise
        run: npm run staging:exercise
      - name: National load suite
        env:
          BASE_URL: ${{ env.STAGING_BASE_URL }}
          LOAD_PROFILE: ci
        run: npm run load:national
      - name: Stop local staging app
        if: always()
        run: |
          if [ -f .staging-app.pid ]; then kill "$(cat .staging-app.pid)" || true; fi
