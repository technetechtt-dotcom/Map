name: Production deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main, master]

permissions:
  actions: read
  contents: read
  checks: read

concurrency:
  group: production-deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - id: sha
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "value=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Require green CI and Security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/assert-main-green.js --wait

  database-migration:
    needs: certify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.certify.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Preflight external identity collision check
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.PRODUCTION_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.DIRECT_URL || secrets.PRODUCTION_DATABASE_URL || secrets.DATABASE_URL }}
        run: node scripts/external-identity-preflight.js
      - name: Controlled production database migration (prisma migrate deploy)
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.DIRECT_URL || secrets.PRODUCTION_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.DIRECT_URL || secrets.PRODUCTION_DATABASE_URL || secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Post-migration database smoke test
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.PRODUCTION_DATABASE_URL || secrets.DIRECT_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL || secrets.DIRECT_URL || secrets.PRODUCTION_DATABASE_URL || secrets.DATABASE_URL }}
        run: node scripts/ingestion-post-migration-smoke.js

  deploy:
    needs: [certify, database-migration]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.certify.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Re-check the SHA is still green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ needs.certify.outputs.sha }}
        run: node scripts/assert-main-green.js
      - name: Validate deploy configuration
        env:
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          OPS_APP_URL: ${{ secrets.OPS_APP_URL }}
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          OPS_DEPLOY_HOOK: ${{ secrets.OPS_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          RENDER_OPS_SERVICE_ID: ${{ secrets.RENDER_OPS_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/ops-preflight.js deploy
      - name: Deploy certified SHA (public + ops when configured)
        env:
          CERTIFIED_SHA: ${{ needs.certify.outputs.sha }}
          GIT_COMMIT: ${{ needs.certify.outputs.sha }}
          GITHUB_SHA: ${{ needs.certify.outputs.sha }}
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          OPS_DEPLOY_HOOK: ${{ secrets.OPS_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_PRODUCTION_SERVICE_ID: ${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}
          RENDER_OPS_SERVICE_ID: ${{ secrets.RENDER_OPS_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_OPS_PROJECT_ID: ${{ secrets.VERCEL_OPS_PROJECT_ID }}
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          OPS_APP_URL: ${{ secrets.OPS_APP_URL }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/deploy-both-platforms.js

      - name: Verify live public SHA
        if: success()
        env:
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CERTIFIED_SHA: ${{ needs.certify.outputs.sha }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/post-deploy-verify.js

      - name: Verify live ops SHA
        if: success()
        env:
          PRODUCTION_APP_URL: ${{ secrets.OPS_APP_URL }}
          CERTIFIED_SHA: ${{ needs.certify.outputs.sha }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/post-deploy-verify.js

      - name: Alert on deployment failure
        if: failure()
        env:
          CERTIFIED_SHA: ${{ needs.certify.outputs.sha }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          echo "Production release of $CERTIFIED_SHA failed verification."
          node -e "
            const url = process.env.NOTIFY_WEBHOOK_URL;
            if (url) {
              fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: 'CRITICAL: Production deploy verification failed for certified SHA ' + process.env.CERTIFIED_SHA,
                  sha: process.env.CERTIFIED_SHA,
                  timestamp: new Date().toISOString()
                })
              }).catch(() => {});
            }
          "
