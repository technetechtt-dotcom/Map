# Northern Cape ICT Map — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Neon is external. On Blueprint apply, paste Neon pooled/unpooled URLs when prompted.
# Shared secrets live in env group `sa-ict-shared` so public + ops stay in sync.
#
# Dashboard: New → Blueprint → GitHub repo technetechtt-dotcom/Map (branch main)

envVarGroups:
  - name: sa-ict-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: RENDER_NEON_BOOTSTRAP
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CAPTCHA_DISABLED
        value: "1"
      - key: GEOCODER_DISABLED
        value: "1"
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_ALLOW_LOCAL_FALLBACK
        value: "1"
      - key: RATE_LIMIT_ALLOW_MEMORY
        value: "1"
      - key: MONITORING_OPTIONAL
        value: "1"
      - key: MFA_ENFORCE
        value: "0"
      - key: HIBP_DISABLED
        value: "1"
      - key: NODE_ENV
        value: production

services:
  - type: web
    name: sa-ict-map-public
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: test -f src/components/AdminShell.tsx && npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health/live
    envVars:
      - fromGroup: sa-ict-shared
      - key: APP_PLATFORM
        value: public
      - key: NEXTAUTH_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: OPS_APP_URL
        sync: false
      - key: NEXT_PUBLIC_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_OPS_APP_URL
        sync: false

  - type: web
    name: sa-ict-map-ops
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: test -f src/components/AdminShell.tsx && npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health/live
    envVars:
      - fromGroup: sa-ict-shared
      - key: APP_PLATFORM
        value: ops
      - key: NEXTAUTH_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: OPS_APP_URL
        sync: false
      - key: NEXT_PUBLIC_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_OPS_APP_URL
        sync: false
