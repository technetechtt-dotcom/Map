name: Production deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main, master]

permissions:
  actions: read
  contents: read
  checks: read

concurrency:
  group: production-deploy-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  certify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - id: sha
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "value=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Require green CI and Security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/assert-main-green.js --wait

  deploy:
    needs: certify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.certify.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Re-check the SHA is still green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ needs.certify.outputs.sha }}
        run: node scripts/assert-main-green.js
      - name: Validate deploy configuration
        run: node scripts/ops-preflight.js deploy
      - name: Deploy certified SHA and prove live origin
        env:
          CERTIFIED_SHA: ${{ needs.certify.outputs.sha }}
          GIT_COMMIT: ${{ needs.certify.outputs.sha }}
          GITHUB_SHA: ${{ needs.certify.outputs.sha }}
          PRODUCTION_DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION_APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/deploy-production.js
