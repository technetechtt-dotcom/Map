name: Tag signature check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  signed-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Require an annotated, verified release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-github-tag-signature.js
