name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      NEXTAUTH_SECRET: "ci-test-secret-not-for-production-use"
      NEXTAUTH_URL: "http://localhost:3000"
      CAPTCHA_DISABLED: "1"
      BACKUP_ENCRYPTION_KEY: "ci-backup-encryption-key-min-16"
      ALLOW_DEMO_USERS: "0"
      SEED_ADMIN_PASSWORD: "CI-Temp-Admin-Pass-99!"
      ALLOW_DATABASE_RESET: "1"
      NODE_ENV: test
      TRUST_PROXY: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Prisma generate + schema push
        run: npx prisma generate && npx prisma db push --skip-generate

      - name: Seed smoke (destructive allowed in CI)
        run: node prisma/seed.js

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Backup encrypt smoke
        run: node scripts/restore-backup-smoke.js

      - name: Docs present
        run: |
          test -f docs/ops-runbook.md
          test -f docs/popia-governance.md
          test -f docs/next15-upgrade.md
          test -f docs/data-quality.md

  postgres-postgis:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: ictmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: PostGIS + coordinate sync trigger
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d ictmap -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d ictmap -f prisma/migrations/20260326_postgis_init.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d ictmap -c "SELECT PostGIS_Version();"
      - name: Docs present
        run: |
          test -f scripts/restore-backup.md
          test -f docs/ops-runbook.md
          test -f docs/popia-governance.md
