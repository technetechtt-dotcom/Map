name: Encrypted production backup

on:
  schedule:
    - cron: "25 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Validate backup configuration
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_DESTINATION: ${{ secrets.BACKUP_DESTINATION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
          S3_BACKUP_ACCESS_KEY_ID: ${{ secrets.S3_BACKUP_ACCESS_KEY_ID }}
          S3_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.S3_BACKUP_SECRET_ACCESS_KEY }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$BACKUP_ENCRYPTION_KEY"
          test -n "$BACKUP_DESTINATION"
          test -n "$S3_BUCKET"
          test -n "$S3_BACKUP_BUCKET"
          test -n "$S3_BACKUP_ACCESS_KEY_ID"
          test -n "$S3_BACKUP_SECRET_ACCESS_KEY"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Dump and encrypt database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          FALLBACK_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          RAW="${DATABASE_URL:-$FALLBACK_DATABASE_URL}"
          URL="$(node -e "process.stdout.write(require('./scripts/pg-url').libpqUrl(process.argv[1] || ''))" "$RAW")"
          pg_dump --format=custom --no-owner --file=database.dump "$URL"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output database.dump.gpg database.dump
          sha256sum database.dump.gpg | tee database.dump.gpg.sha256
      - name: Export object-storage manifest and copy objects
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_BACKUP_ACCESS_KEY_ID: ${{ secrets.S3_BACKUP_ACCESS_KEY_ID }}
          S3_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.S3_BACKUP_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BACKUP_REGION: ${{ secrets.S3_BACKUP_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BACKUP_ENDPOINT: ${{ secrets.S3_BACKUP_ENDPOINT }}
        run: |
          mkdir -p data
          npm ci
          if [ "$(date -u +%u)" = "7" ]; then export OBJECT_BACKUP_FULL=1; fi
          npm run backup:objects
          test -f data/object-backup-result.json
          test -f data/object-storage-manifest.json
          node -e 'const m=JSON.parse(require("fs").readFileSync("data/object-storage-manifest.json","utf8")); const rows=Array.isArray(m)?m:(m.objects||[]); if(!rows.every(r=>r&&r.backupKey)) process.exit(1);'
          sha256sum data/object-backup-result.json | tee data/object-backup-result.json.sha256
          sha256sum data/object-storage-manifest.json | tee data/object-storage-manifest.json.sha256
      - name: Upload and verify off-site copies
        env:
          BACKUP_DESTINATION: ${{ secrets.BACKUP_DESTINATION }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          rclone copy database.dump.gpg "$BACKUP_DESTINATION/database/$DATE/"
          rclone copy database.dump.gpg.sha256 "$BACKUP_DESTINATION/database/$DATE/"
          rclone copy data/object-storage-manifest.json "$BACKUP_DESTINATION/objects/$DATE/"
          rclone copy data/object-storage-manifest.json.sha256 "$BACKUP_DESTINATION/objects/$DATE/"
          rclone copy data/object-backup-result.json "$BACKUP_DESTINATION/objects/$DATE/"
          rclone copy data/object-backup-result.json.sha256 "$BACKUP_DESTINATION/objects/$DATE/"
          rclone copyto "$BACKUP_DESTINATION/database/$DATE/database.dump.gpg" remote-database.dump.gpg
          sha256sum remote-database.dump.gpg | tee remote-database.dump.gpg.sha256
          LOCAL=$(cut -d' ' -f1 database.dump.gpg.sha256)
          REMOTE_BYTES=$(cut -d' ' -f1 remote-database.dump.gpg.sha256)
          test "$LOCAL" = "$REMOTE_BYTES"
          rclone check database.dump.gpg "$BACKUP_DESTINATION/database/$DATE/" --one-way
      - name: Record verified backup health
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          CHECKSUM=$(cut -d' ' -f1 database.dump.gpg.sha256)
          SIZE=$(stat -c%s database.dump.gpg)
          curl -fsS -X POST "$APP_URL/api/admin/backups/record" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"kind\":\"database\",\"filename\":\"database.dump.gpg\",\"path\":\"offsite\",\"sizeBytes\":$SIZE,\"checksumSha256\":\"$CHECKSUM\"}"
          node -e '
            const fs = require("fs");
            const result = JSON.parse(fs.readFileSync("data/object-backup-result.json", "utf8"));
            if (!result.ok) process.exit(1);
            const payload = {
              kind: "objects",
              filename: "object-storage-manifest.json",
              path: "offsite",
              objectsCopied: result.copied,
              checksumSha256: result.checksumSha256,
              sizeBytes: result.copiedBytes || 0,
              cursorJson: result.cursor || null,
              status: result.status || (result.ok ? "SUCCESS" : "FAILED"),
              backupRunId: result.backupRunId || null,
              attemptedObjects: result.attemptedObjects || 0,
              copiedObjects: result.copiedObjects || result.copied || 0,
              verifiedObjects: result.verifiedObjects || result.verified || 0,
              failedObjects: Array.isArray(result.failed) ? result.failed.length : 0,
              startedAt: result.startedAt || null,
              completedAt: result.completedAt || null,
              manifestHash: result.manifestHash || result.checksumSha256,
              failureReason: result.failureReason || null,
            };
            fs.writeFileSync("data/object-backup-record.json", JSON.stringify(payload));
          '
          curl -fsS -X POST "$APP_URL/api/admin/backups/record" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @data/object-backup-record.json
      - name: Alert on backup failure
        if: failure()
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$NOTIFY_WEBHOOK_URL" ]; then
            curl -sS -X POST "$NOTIFY_WEBHOOK_URL" -H 'Content-Type: application/json' \
              -d '{"type":"backup.failed","subject":"Production backup failed","body":"The scheduled encrypted backup workflow failed. Investigate immediately."}'
          fi
          echo "Backup failed — paging operators"
          exit 1
